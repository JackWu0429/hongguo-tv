plugins {
    id "com.android.application"
}

def appVersion = "0.2.30"
def coreVersion = System.getenv("HONGGUO_CORE_VERSION") ?: "${appVersion}-dev"
def signingVariables = ["ANDROID_KEYSTORE_FILE", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD"]
def releaseSigningReady = signingVariables.every { System.getenv(it) }

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 35

    defaultConfig {
        applicationId "rocks.aston.hongguotv"
        minSdk 23
        targetSdk 35
        versionCode 32
        versionName appVersion
        buildConfigField "String", "CORE_VERSION", "\"${coreVersion}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "红果短剧 调试版"
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Never upload an unsigned APK when release credentials are missing.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == "validateSigningRelease" } && !releaseSigningReady) {
        throw new GradleException("Release signing requires all four Android signing environment variables")
    }
}

dependencies { testImplementation "junit:junit:4.13.2" }
