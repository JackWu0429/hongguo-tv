plugins {
    id "com.android.application"
}

android {
    namespace "rocks.aston.hongguotv"
    compileSdk 35

    defaultConfig {
        applicationId "rocks.aston.hongguotv"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "0.2.1-dev"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
