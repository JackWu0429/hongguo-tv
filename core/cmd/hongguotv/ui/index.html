<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>红果短剧 TV</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <symbol id="icon-recommend" viewBox="0 0 24 24"><path d="M4 4h16v11H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m8 19 4-3 4 3M8 8h8M8 11h5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 5 5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></symbol>
    <symbol id="icon-rank" viewBox="0 0 24 24"><path d="M5 19V11M12 19V5M19 19v-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/><path d="M3 19h18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></symbol>
    <symbol id="icon-new" viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 3v-3H6.5A2.5 2.5 0 0 1 4 14.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 10h8M8 13h5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 5v5h5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.8"/></symbol>
    <symbol id="icon-favorite" viewBox="0 0 24 24"><path d="M12 20.2S4 15.4 4 9.7A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 8 2.7c0 5.7-8 10.5-8 10.5Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.8"/></symbol>
    <symbol id="icon-like" viewBox="0 0 24 24"><path d="M8 10v10H5V10zM8 19h8.7a2 2 0 0 0 1.9-1.5l1.1-4.5a2 2 0 0 0-1.9-2.5H14l.6-3.2A2.6 2.6 0 0 0 12.1 4L8 10" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.7"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2.2V10a4.5 4.5 0 0 0-9 0v4.8zM10 20h4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7"/></symbol>
    <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 20S4 15.2 4 9.7A4.1 4.1 0 0 1 12 7a4.1 4.1 0 0 1 8 2.7C20 15.2 12 20 12 20Z" fill="currentColor"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 20a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z" fill="currentColor"/></symbol>
  </svg>
  <main class="app-shell" data-mode="recommend">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24"><use href="#icon-play" xlink:href="#icon-play"></use></svg></span><span>红果短剧</span></div>
      <nav class="side-nav" id="side-nav" data-focus-zone="sidebar">
        <button class="side-item is-active" data-page="recommend" data-focus="sidebar-recommend"><svg class="side-icon"><use href="#icon-recommend" xlink:href="#icon-recommend"></use></svg><span>推荐</span></button>
        <button class="side-item" data-page="search" data-focus="sidebar-search"><svg class="side-icon"><use href="#icon-search" xlink:href="#icon-search"></use></svg><span>找剧</span></button>
        <button class="side-item" data-page="rank" data-focus="sidebar-rank"><svg class="side-icon"><use href="#icon-rank" xlink:href="#icon-rank"></use></svg><span>排行榜</span></button>
        <button class="side-item" data-page="new" data-focus="sidebar-new"><svg class="side-icon"><use href="#icon-new" xlink:href="#icon-new"></use></svg><span>新剧</span></button>
        <button class="side-item" data-page="history" data-focus="sidebar-history"><svg class="side-icon"><use href="#icon-history" xlink:href="#icon-history"></use></svg><span>历史</span></button>
        <button class="side-item" data-page="favorites" data-focus="sidebar-favorites"><svg class="side-icon"><use href="#icon-favorite" xlink:href="#icon-favorite"></use></svg><span>收藏</span></button>
        <button class="side-item" data-page="likes" data-focus="sidebar-likes"><svg class="side-icon"><use href="#icon-like" xlink:href="#icon-like"></use></svg><span>点赞</span></button>
        <button class="side-item" data-page="reservations" data-focus="sidebar-reservations"><svg class="side-icon"><use href="#icon-bell" xlink:href="#icon-bell"></use></svg><span>预约</span></button>
        <button class="side-item" data-page="support" data-focus="sidebar-support"><svg class="side-icon"><use href="#icon-heart" xlink:href="#icon-heart"></use></svg><span>打赏</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="author">作者：洋演</div>
        <button class="side-item side-item-secondary" data-page="account" data-focus="sidebar-account"><svg class="side-icon"><use href="#icon-user" xlink:href="#icon-user"></use></svg><span>我的 / 登录</span></button>
      </div>
    </aside>

    <section class="main-surface" id="main-surface" tabindex="-1">
      <div class="top-bar">
        <div class="page-context" id="page-context">推荐</div>
        <div class="channel-tabs" id="channel-tabs" data-focus-zone="channels" aria-label="推荐频道">
          <button class="channel-tab" data-focus="channel-follow">关注</button>
          <button class="channel-tab" data-focus="channel-comic">漫剧</button>
          <button class="channel-tab" data-focus="channel-real">真人剧</button>
          <button class="channel-tab is-active" data-focus="channel-recommend">推荐</button>
        </div>
        <div class="top-status" id="core-status">连接核心服务…</div>
      </div>

      <section class="page-placeholder is-hidden" id="page-placeholder" aria-live="polite">
        <div class="page-placeholder-mark"><svg><use href="#icon-recommend" xlink:href="#icon-recommend"></use></svg></div>
        <h1 id="page-placeholder-title">页面准备中</h1>
        <p id="page-placeholder-copy">这个页面的红果数据接口还在接入。</p>
        <button class="primary-action page-placeholder-action" data-action="return-recommend" data-focus="page-placeholder-action">返回推荐</button>
      </section>

      <section class="search-page is-hidden" id="search-page" aria-label="找剧">
        <div class="search-heading-row">
          <div>
            <h1>找剧</h1>
            <p>选择分类浏览，或输入剧名搜索</p>
          </div>
          <div class="search-box">
            <input id="search-input" class="search-input" type="search" autocomplete="off" placeholder="输入剧名 / 关键词" aria-label="输入剧名或关键词">
            <button class="search-submit search-action" data-action="search-submit" data-focus="search-submit">搜索</button>
            <button id="search-browse" class="search-browse search-action is-hidden" data-action="search-browse" data-focus="search-browse">按分类找剧</button>
          </div>
        </div>
        <div class="filter-panel" id="filter-panel" data-focus-zone="searchFilters">
          <div id="filter-rows"><div class="filter-status">正在读取筛选条件…</div></div>
          <div class="filter-row filter-row-note"><span>左右选择，上下切换筛选项</span><span id="filter-state">全部</span></div>
        </div>
        <div class="search-result-head"><strong id="search-result-title">全部短剧</strong><span id="search-result-count"></span></div>
        <div class="search-results" id="search-results" data-focus-zone="searchResults" aria-live="polite"></div>
        <div class="search-pagination"><button id="search-more" class="search-more is-hidden" data-focus="search-more">加载更多</button><span id="search-page-status" role="status"></span></div>
      </section>

      <section class="rank-page page-workspace is-hidden" id="rank-page" aria-label="排行榜">
        <div class="rank-heading-row">
          <h1>排行榜</h1>
          <div class="rank-tabs" data-focus-zone="rankTabs">
            <button class="rank-tab is-active" data-rank-path="/rank/hot-drama" data-focus="rank-tab-all">全部</button>
            <button class="rank-tab" data-rank-path="/rank/hot-real-drama" data-focus="rank-tab-real">真人剧</button>
            <button class="rank-tab" data-rank-path="/rank/hot-comic-drama" data-focus="rank-tab-comic">漫剧</button>
            <button class="rank-tab" data-rank-path="/rank/hot-ai-drama" data-focus="rank-tab-ai">AI剧</button>
            <button class="rank-tab" data-rank-unavailable="演员榜" data-focus="rank-tab-actor">演员</button>
            <button class="rank-tab" data-rank-unavailable="系列剧榜" data-focus="rank-tab-series">系列剧</button>
          </div>
        </div>
        <div class="rank-layout">
          <nav class="rank-subnav" data-focus-zone="rankSubnav" aria-label="榜单类型">
            <button class="rank-subtab" data-rank-label="推荐榜" data-focus="rank-sub-recommend">推荐榜</button>
            <button class="rank-subtab is-active" data-rank-label="热播榜" data-focus="rank-sub-hot">热播榜</button>
            <button class="rank-subtab" data-rank-label="臻果榜" data-focus="rank-sub-premium">臻果榜</button>
            <button class="rank-subtab" data-rank-label="预约榜" data-focus="rank-sub-reserve">预约榜</button>
            <button class="rank-subtab" data-rank-label="新剧榜" data-focus="rank-sub-new">新剧榜</button>
            <button class="rank-subtab" data-rank-label="热搜榜" data-focus="rank-sub-search">热搜榜</button>
            <button class="rank-subtab" data-rank-label="必看榜" data-focus="rank-sub-must">必看榜</button>
            <button class="rank-subtab" data-rank-label="收藏榜" data-focus="rank-sub-favorite">收藏榜</button>
          </nav>
          <div class="rank-main">
            <div class="rank-list-heading"><strong id="rank-list-title">热播榜</strong><span id="rank-list-update">红果热播榜</span><span class="rank-period">总榜</span></div>
            <div class="rank-list" id="rank-list" data-focus-zone="rankItems" aria-live="polite"></div>
          </div>
        </div>
      </section>

      <section class="new-page page-workspace is-hidden" id="new-page" aria-label="新剧">
        <div class="new-heading-row">
          <h1>新剧</h1>
          <div class="new-tabs" data-focus-zone="newTabs">
            <button class="new-tab is-active" data-new-mode="recommend" data-focus="new-tab-recommend">新剧推荐</button>
            <button class="new-tab" data-new-mode="calendar" data-focus="new-tab-calendar">上新日历</button>
          </div>
          <div class="new-filters" data-focus-zone="newFilters">
            <button class="new-filter is-active" data-new-gender="all" data-focus="new-filter-all">全部</button>
            <button class="new-filter" data-new-gender="male" data-focus="new-filter-male">男频</button>
            <button class="new-filter" data-new-gender="female" data-focus="new-filter-female">女频</button>
          </div>
        </div>
        <div class="new-date-strip is-hidden" id="new-date-strip" data-focus-zone="calendarDays" aria-label="上新日期"></div>
        <div class="new-grid" id="new-grid" data-focus-zone="newItems" aria-live="polite"></div>
        <div class="calendar-list is-hidden" id="calendar-list" data-focus-zone="calendarItems" aria-live="polite"></div>
      </section>

      <section class="reservation-page page-workspace is-hidden" id="reservation-page" aria-label="我的预约">
        <h1>我的预约</h1>
        <div class="reservation-tabs" data-focus-zone="reservationTabs">
          <button class="reservation-tab is-active" data-reservation-mode="online" data-focus="reservation-online">已上线</button>
          <button class="reservation-tab" data-reservation-mode="upcoming" data-focus="reservation-upcoming">待上线</button>
        </div>
        <div class="reservation-empty" id="reservation-empty" data-focus-zone="reservationItems">没有已上线的预约</div>
      </section>

      <section class="hero" id="hero" aria-label="推荐视频">
        <div class="hero-media">
          <img id="hero-backdrop" class="hero-backdrop" alt="">
          <video id="hero-video" class="hero-video" playsinline preload="metadata"></video>
          <button class="hero-feed-focus" id="hero-feed-focus" data-focus="hero-feed" aria-label="当前推荐短剧"></button>
          <div class="hero-placeholder" id="hero-placeholder">
            <div class="placeholder-kicker">红果短剧 TV</div>
            <h1 id="hero-placeholder-title">正在读取推荐</h1>
            <p id="hero-placeholder-summary">正在连接红果内容服务…</p>
            <button class="primary-action" data-action="featured" data-focus="hero-featured">查看详情</button>
          </div>
          <div class="hero-gradient"></div>
          <div class="hero-top-copy" id="hero-top-copy"><strong id="hero-top-title">红果短剧</strong><span id="hero-top-episode">第1集</span></div>
          <div class="hero-top-right"><strong id="hero-top-count">1 / 0</strong><span>↑↓ 切换</span></div>
          <div class="catalog-ribbon" id="catalog-ribbon" aria-label="分类内容">
            <div class="catalog-heading" id="catalog-heading">热播短剧</div>
            <div class="catalog-track" id="catalog-track" data-focus-zone="catalog" aria-label="短剧列表"></div>
          </div>
          <div class="hero-title">推荐内容</div>
          <div class="hero-episode">接口接入中</div>
          <div class="hero-summary">当前版本先验证 Mac 布局、TV 遥控器焦点和本地 Go 服务通信。</div>
        </div>

        <div class="right-actions" data-focus-zone="actions" aria-label="视频操作">
          <button class="round-action" data-action="favorite" data-focus="hero-favorite"><span>♡</span><small>收藏</small></button>
          <button class="round-action" data-action="comment" data-focus="hero-comment"><span>☁</span><small>评论</small></button>
          <button class="round-action" data-action="share" data-focus="hero-share"><span>↗</span><small>分享</small></button>
        </div>

        <div class="bottom-controls" data-focus-zone="controls" aria-label="播放控制">
          <button class="control-button" data-action="pause" data-focus="control-pause">▶/Ⅱ</button>
          <span class="time-label">00:00 / --:--</span>
          <div class="progress-track"><span></span></div>
          <button class="control-button" data-action="episodes" data-focus="control-episodes">选集 · -- 集</button>
          <button class="control-button" data-action="quality" data-focus="control-quality">清晰度</button>
          <button class="control-button" data-action="speed" data-focus="control-speed">1.0x</button>
          <button class="control-button" data-action="fullscreen" data-focus="control-fullscreen">全屏</button>
        </div>
      </section>

      <section class="detail-modal is-hidden" id="detail-modal" aria-hidden="true" aria-label="短剧详情">
        <div class="detail-dialog" role="dialog" aria-modal="true">
          <div class="detail-header">
            <span id="detail-title">短剧详情</span>
            <button class="detail-close modal-action" id="detail-close" data-focus="detail-close" aria-label="关闭">×</button>
          </div>
          <div class="detail-main">
            <img class="detail-cover" id="detail-cover" alt="">
            <div class="detail-copy">
              <h2 id="detail-name">正在加载…</h2>
              <div class="detail-meta" id="detail-meta"></div>
              <p id="detail-intro">正在读取详情…</p>
              <button class="detail-play modal-action" id="detail-play" data-focus="detail-play">播放第一集</button>
            </div>
          </div>
          <div class="detail-episodes" id="detail-episodes" data-focus-zone="episodes" aria-label="集数列表"></div>
        </div>
      </section>

      <div class="notice" id="action-notice" role="status" aria-live="polite">正在连接 Go 核心…</div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
