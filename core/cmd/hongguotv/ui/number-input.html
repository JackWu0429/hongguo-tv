<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>红果短剧 · 手机输入</title>
<style>
body{margin:0;background:#15151e;color:#fff;font:17px/1.6 sans-serif;padding:24px;box-sizing:border-box}main{max-width:420px;margin:40px auto}h1{font-size:26px}p{color:#c2c3ce}input,button{display:block;width:100%;box-sizing:border-box;padding:14px;margin:18px 0;font:inherit;border-radius:10px}input{background:#252631;color:#fff;border:2px solid #737586;font-size:24px}input[type=hidden]{display:none}button{background:#c73555;color:#fff;border:0}.error{color:#ffadb8}.hint{font-size:14px}
</style></head><body><main>
{{if .Expired}}<h1>输入已结束</h1><p>请在电视上重新打开数字键盘，再扫描新的二维码。</p>
{{else if .Complete}}<h1>已发送到电视</h1><p>请回到电视继续操作。此页面不会发送短信或登录账号。</p>
{{else}}<h1>{{if .Phone}}输入手机号{{else}}输入验证码{{end}}</h1><p>填写或粘贴数字，点击完成后回填到电视。</p>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}" autocomplete="off"><input type="hidden" name="form_key" value="{{.FormKey}}"><label for="value">{{if .Phone}}手机号{{else}}短信验证码{{end}}</label><input id="value" name="value" type="tel" inputmode="numeric" autocomplete="{{if .Phone}}off{{else}}one-time-code{{end}}" required minlength="{{if .Phone}}11{{else}}4{{end}}" maxlength="{{if .Phone}}11{{else}}8{{end}}" pattern="{{if .Phone}}1[3-9][0-9]{9}{{else}}[0-9]{4,8}{{end}}"><button type="submit">完成，回填电视</button></form>
<p class="hint">手机和电视需在同一局域网。二维码5分钟有效，电视关闭输入后立即失效。数字仅用于本次输入，不会保存。</p>{{end}}
</main></body></html>
