name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read APK version
        run: python3 scripts/release_metadata.py --github-env "$GITHUB_ENV"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test Go core
        run: go test ./...
      - name: Check TV JavaScript and pagination
        run: |
          node --check core/cmd/hongguotv/ui/app.js
          node --check core/cmd/hongguotv/ui/native-player.js
          node --check core/cmd/hongguotv/ui/playback-diagnostics.js
          node --check core/cmd/hongguotv/ui/compat.js
          node --check core/cmd/hongguotv/ui/episode-prefetch.js
          node --check core/cmd/hongguotv/ui/updates.js
          node --check core/cmd/hongguotv/ui/engagement.js
          node --check core/cmd/hongguotv/ui/sms-verification.js
          node --check core/cmd/hongguotv/ui/numeric-keypad.js
          node --check core/cmd/hongguotv/ui/number-input.js
          node --check core/cmd/hongguotv/ui/search-history.js
          python3 -m unittest discover -s tests -p "test_*.py"
          node --test tests/*.test.cjs
      - name: Build Android native binaries
        run: bash scripts/build_android_binaries.sh
        env:
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}
      - name: Build and lint debug APK
        run: gradle -p android testDebugUnitTest assembleDebug lintDebug
