name: Publish signed download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag
        required: true
        type: string
        default: v0.2.9

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: hongguo-signed-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download the existing signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG'])
          PY
          version="${RELEASE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/signed-download"
          python3 - <<'PY'
          import json, os, subprocess
          tag = os.environ['RELEASE_TAG']; version = tag[1:]
          info = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY'], '--json', 'assets']))
          names = {a['name'] for a in info['assets']}
          allowed = [f'hongguo-tv-{version}.apk', 'SHA256SUMS.txt', 'update.json']
          if 'update-mpv.json' in names:
              allowed += [f'hongguo-tv-mpv-{version}.apk', f'hongguo-tv-mpv-library-source-{version}.zip', 'update-mpv.json']
          if not set(allowed).issubset(names): raise ValueError('Missing signed release files')
          command = ['gh', 'release', 'download', tag, '--repo', os.environ['GITHUB_REPOSITORY'], '--dir', os.environ['RUNNER_TEMP'] + '/signed-download']
          for name in allowed: command += ['--pattern', name]
          subprocess.run(command, check=True)
          PY
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from publish_public_release import verify_bundle
          folder = Path(os.environ['RUNNER_TEMP']) / 'signed-download'
          manifests, files = verify_bundle(folder)
          metadata = manifests['update.json']
          assert 'v' + metadata['version_name'] == os.environ['RELEASE_TAG']
          (folder / 'release-notes.md').write_text(metadata['release_notes'])
          print('Verified exact signed release files:', ', '.join(p.name for p in files))
          PY
          mkdir -p "$RUNNER_TEMP/public-download"
          cp "$RUNNER_TEMP/signed-download/hongguo-tv-$version.apk" "$RUNNER_TEMP/public-download/"
          cp "$RUNNER_TEMP/signed-download/hongguo-tv-mpv-$version.apk" "$RUNNER_TEMP/public-download/"
          cp "$RUNNER_TEMP/signed-download/update.json" "$RUNNER_TEMP/public-download/"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          folder = Path(os.environ['RUNNER_TEMP']) / 'public-download'
          private = json.loads((Path(os.environ['RUNNER_TEMP']) / 'signed-download' / 'update-mpv.json').read_text())
          private.pop('library_source', None)
          (folder / 'update-mpv.json').write_text(json.dumps(private, ensure_ascii=False, indent=2) + '\n')
          PY
          (cd "$RUNNER_TEMP/public-download" && sha256sum "hongguo-tv-$version.apk" "hongguo-tv-mpv-$version.apk" > SHA256SUMS.txt)
          cp "$RUNNER_TEMP/signed-download/release-notes.md" "$RUNNER_TEMP/public-download/release-notes.md"
      - name: Publish only the verified download files
        env:
          GH_TOKEN: ${{ secrets.HONGGUO_RELEASES_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "Configure the scoped HONGGUO_RELEASES_TOKEN" >&2; exit 1; }
          python3 scripts/publish_public_release.py --directory "$RUNNER_TEMP/public-download" --notes "$RUNNER_TEMP/public-download/release-notes.md"
