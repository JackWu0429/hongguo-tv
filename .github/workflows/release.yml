name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HONGGUO_CORE_VERSION: 0.2.3-${{ github.sha }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
          cache-dependency-path: go.mod
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Test Go core
        run: go test ./...
      - name: Check TV JavaScript and pagination
        run: |
          node --check core/cmd/hongguotv/ui/app.js
          node --check core/cmd/hongguotv/ui/compat.js
          node --test tests/*.test.cjs
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v0.2.3"
      - name: Build Android native binaries
        run: bash scripts/build_android_binaries.sh
        env:
          VERSION: ${{ env.HONGGUO_CORE_VERSION }}
      - name: Restore signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing release signing key" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hongguo-release.keystore"
          chmod 600 "$RUNNER_TEMP/hongguo-release.keystore"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hongguo-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android testReleaseUnitTest assembleRelease lintRelease
      - name: Verify APK signature and version
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          sed -n '1,5p' "$RUNNER_TEMP/apk-badging.txt"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hongguo-release.keystore"
      - name: Prepare versioned release files
        run: |
          mkdir -p "$RUNNER_TEMP/hongguo-release"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hongguo-release/hongguo-tv-0.2.3.apk"
          cd "$RUNNER_TEMP/hongguo-release"
          sha256sum hongguo-tv-0.2.3.apk > SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-tv-release-apk
          path: ${{ runner.temp }}/hongguo-release/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 红果短剧 TV v0.2.3
          body_path: docs/releases/v0.2.3.md
          files: ${{ runner.temp }}/hongguo-release/*
